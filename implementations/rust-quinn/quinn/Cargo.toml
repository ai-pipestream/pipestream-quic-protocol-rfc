[package]
name = "pipestream-quinn"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Quinn transport for the PipeStream protocol"

[lib]
name = "pipestream_quic"

[dependencies]
anyhow = "1.0.104"
pipestream-core = { path = ".." }
quinn = "0.11.11"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
tempfile = "3.27.0"

[dev-dependencies]
rcgen = "0.14.10"
