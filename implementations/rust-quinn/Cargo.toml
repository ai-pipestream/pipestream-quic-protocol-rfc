[workspace]
resolver = "3"
members = [".", "conformance", "quinn", "server"]
default-members = [".", "conformance", "quinn", "server"]

[package]
name = "pipestream-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Transport-independent PipeStream protocol and state machines"

[lib]
name = "pipestream_core"

[dependencies]
minicbor = { version = "2.3.0", features = ["std", "half"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
rand = "0.10.2"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"

[dev-dependencies]
tempfile = "3.27.0"
