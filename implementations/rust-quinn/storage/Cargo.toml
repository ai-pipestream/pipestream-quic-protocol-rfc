[package]
name = "pipestream-storage"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Pluggable storage SPI (ObjectStore and Journal roles) for PipeStream reference implementations"

[lib]
name = "pipestream_storage"

[dependencies]
aws-sdk-s3 = { version = "1.122.0", default-features = false, features = [
    "behavior-version-latest",
    "http-1x",
    "rt-tokio",
    "sigv4a",
] }
aws-smithy-http-client = { version = "1.1.9", features = ["hyper-014", "legacy-rustls-ring"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
mongodb = "3.9.1"
postgres = "0.19"
rskafka = "0.6.0"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt", "macros"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[dev-dependencies]
tempfile = "3.27.0"
