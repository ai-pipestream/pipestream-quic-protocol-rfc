[package]
name = "pipestream-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Runnable PipeStream reference server and client"

[[bin]]
name = "pipestream-quinn"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
pipestream-quinn = { path = "../quinn" }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] }

[dev-dependencies]
rcgen = "0.14.10"
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }
