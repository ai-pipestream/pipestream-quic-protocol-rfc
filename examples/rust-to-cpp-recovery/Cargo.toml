[package]
name = "rust-to-cpp-recovery"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Rust application-profile recovery example for PipeStream Layer 0"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
pipestream-quinn = { path = "../../implementations/rust-quinn/quinn" }
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
