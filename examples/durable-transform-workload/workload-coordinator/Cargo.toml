[package]
name = "workload-coordinator"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "External durable-transform coordinator: sharded sessions, journaled recovery, verified reassembly"

[[bin]]
name = "workload-coordinator"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
pipestream-quinn = { path = "../../../implementations/rust-quinn/quinn" }
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
workload-core = { path = "../workload-core" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }
